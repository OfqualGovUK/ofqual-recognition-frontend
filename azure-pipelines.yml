# Build and push an image to Azure Container Registry
# https://docs.microsoft.com/azure/devops/pipelines/languages/docker

trigger:
  branches:
   include:
     - main
     - releases/*

resources:
- repo: self

pool:
  vmImage: 'ubuntu-latest'

variables:
  # Container registry service connection established during pipeline creation
  dockerfilePath: '$(System.DefaultWorkingDirectory)/Dockerfile'
  tag: '$(Build.BuildId)'
  # .NET SDK Version number
  dotnetVersion: '8.0'

stages:
# Static Analysis stage: This stage runs static code analysis using SonarQube and audits dependencies for vulnerabilities.
- stage: StaticAnalysis
  displayName: 'Run Static Analysis'
  condition: always()
  jobs:
    - job: Snyk
      displayName: "Snyk Analysis"
      steps:
      # Step 1: Set up .NET SDK
      - task: UseDotNet@2
        displayName: 'Use .NET 8.0'
        inputs:
          packageType: 'sdk'
          version: '8.0.x'
      # Step 2: Restore NuGet packages to ensure all dependencies are installed
      - task: DotNetCoreCLI@2
        displayName: 'Restore task'
        inputs:
          command: 'restore'
          projects: '**/*.csproj'
          feedsToUse: 'select'
          vstsFeed: 'b8db0229-c220-4583-b1d9-1111e482a1ce'
      # Step 3: Build
      - task: DotNetCoreCLI@2
        displayName: "Build task"
        inputs:
          command: "build"
          projects: "**/*.csproj"
          arguments: "--no-restore"
        displayName: 'Snyk Install & Auth'
      # Step 6: Scan code
      - task: SnykSecurityScan@1
        displayName: 'Snyk scanning code'
        inputs:
          serviceConnectionEndpoint: 'snyk-integration-eu'
          testType: 'code'
          codeSeverityThreshold: 'high'
          failOnIssues: true
      # Step 7: Scan app
      - task: SnykSecurityScan@1
        displayName: 'Snyk scanning app'
        inputs:
          serviceConnectionEndpoint: 'snyk-integration-eu'
          testType: 'app'
          severityThreshold: 'high'
          failOnIssues: true
          additionalArguments: '--all-projects'
      # Step 8: Scan docker image     
      - task: Docker@2
        displayName: Build Docker Image
        inputs:
          command: build
          repository: $(SNYK_DOCKER_REPOS)   #'register-frontend'
          dockerfile: '$(dockerfilePath)'
          tags: 'latest'
      - script: docker images
        displayName: List Docker Images
      - task: SnykSecurityScan@1
        inputs:
          serviceConnectionEndpoint: 'snyk-integration-eu'
          testType: 'container'
          dockerImageName: '$(SNYK_DOCKER_REPOS):latest'
          dockerfilePath: './Dockerfile'
          monitorWhen: 'always'
          severityThreshold: 'high'
          failOnIssues: false

    # Audit job: This job audits dependencies for vulnerabilities.
    - job: Audit
      displayName: 'Audit Dependencies for Security Vulnerabilities'
      steps:
        # Step 1: Restore NuGet packages to ensure all dependencies are installed
        - task: DotNetCoreCLI@2
          displayName: 'Restore .NET Project Dependencies (NuGet)'
          inputs:
            command: 'restore'
            projects: '**/*.csproj'
        # Step 2: Check for vulnerable dependencies in the project
        - task: Bash@3
          displayName: 'Scan for Vulnerable NuGet Packages'
          inputs:
            targetType: 'inline'
            script: |
              # Run dotnet command to check for vulnerable packages, including transitive dependencies
              dotnet list package --vulnerable --include-transitive 2>&1 | tee build.log
              echo "Analyse dotnet list package command log output..."
              if grep -q -i "critical\|high" build.log; then
                  echo "Must fix security vulnerabilities found on the log output."
                  exit 1      # Fails the job if critical or high vulnerabilities are found
              else
                  echo "No critical or high severity vulnerabilities found."
                  exit 0      # Passes the job if no critical/high vulnerabilities are found
              fi

# Test Stage: This stage runs unit tests, integration tests and end-to-end (E2E) tests.
- stage: Test
  displayName: 'Run Unit, Integration and E2E Tests'
  dependsOn: StaticAnalysis
  condition: succeeded()
  jobs:
    # Unit Test Job: Runs unit tests to validate individual components.
    - job: Unit
      displayName: 'Run Unit Tests'
      dependsOn: []
      steps:
        # Step 1: Set up .NET SDK
        - task: UseDotNet@2
          displayName: 'Set Up .NET SDK (Version $(dotnetVersion))'
          inputs:
            packageType: 'sdk'
            version: '$(dotnetVersion).x'
        # Step 2: Restore project dependencies from NuGet
        - task: DotNetCoreCLI@2
          displayName: 'Restore Project Dependencies'
          inputs:
            command: 'restore'
            projects: '**/*.csproj'
            feedsToUse: 'select'
            verbosityRestore: 'Normal'
        # Step 3: Build the project
        - task: DotNetCoreCLI@2
          displayName: 'Build Project'
          inputs:
            command: 'build'
            projects: '**/*.csproj'
            arguments: '--no-restore'
        # Step 4: Run unit tests and filter by category
        - task: DotNetCoreCLI@2
          displayName: 'Run Unit Tests'
          inputs:
            command: 'test'
            projects: '**/*Tests.csproj'
            arguments: '--no-build --no-restore --filter Category=Unit'
            testRunTitle: 'Recognition-Frontend-Unit-$(Build.BuildId)'
            
    # Integration Test Job: Runs integration tests to validate system interactions.
    - job: Integration
      displayName: 'Run Integration Tests'
      dependsOn: []
      steps:
        # Step 1: Set up .NET SDK
        - task: UseDotNet@2
          displayName: 'Set Up .NET SDK (Version $(dotnetVersion))'
          inputs:
            packageType: 'sdk'
            version: '$(dotnetVersion).x'
        # Step 2: Restore project dependencies from NuGet
        - task: DotNetCoreCLI@2
          displayName: 'Restore Project Dependencies'
          inputs:
            command: 'restore'
            projects: '**/*.csproj'
            feedsToUse: 'select'
            verbosityRestore: 'Normal'
        # Step 3: Build the project
        - task: DotNetCoreCLI@2
          displayName: 'Build Project'
          inputs:
            command: 'build'
            projects: '**/*.csproj'
            arguments: '--no-restore'
        # Step 4: Run integration tests and filter by category
        - task: DotNetCoreCLI@2
          displayName: 'Run Integration Tests'
          inputs:
            command: 'test'
            projects: '**/*Tests.csproj'
            arguments: '--no-build --no-restore --filter Category=Integration'
            testRunTitle: 'Recognition-Frontend-Integration-$(Build.BuildId)'

    # E2E Test Job: Runs UI and functional tests to validate user workflows.
    - job: E2E
      displayName: 'Run E2E Tests'
      dependsOn: []
      steps:
        # Step 1: Set up .NET SDK
        - task: UseDotNet@2
          displayName: 'Set Up .NET SDK (Version $(dotnetVersion))'
          inputs:
            packageType: 'sdk'
            version: '$(dotnetVersion).x'
        # Step 2: Restore project dependencies from NuGet
        - task: DotNetCoreCLI@2
          displayName: 'Restore Project Dependencies'
          inputs:
            command: 'restore'
            projects: '**/*.csproj'
            feedsToUse: 'select'
            verbosityRestore: 'Normal'
        # Step 3: Build the project
        - task: DotNetCoreCLI@2
          displayName: 'Build Project'
          inputs:
            command: 'build'
            projects: '**/*.csproj'
            arguments: '--no-restore'
        # Step 4: Install Playwright browsers
        - script: |
            pwsh Ofqual.Recognition.Frontend.Playwright/bin/Debug/net$(dotnetVersion)/playwright.ps1 install --with-deps
          displayName: 'Install E2E Test Browsers'
        # Step 5: Start the application server
        - script: |
            dotnet run --project Ofqual.Recognition.Frontend.Web/Ofqual.Recognition.Frontend.Web.csproj --urls "$(TestSettings__BaseUrl)" &
            sleep 10
          displayName: 'Start Application Server for E2E Tests'
          env:
            FeatureFlag__Application: '$(FeatureFlag__Application)'
            RecognitionApi__BaseUrl: '$(RecognitionApi__BaseUrl)'
            RecognitionApi__Scopes__0: '$(RecognitionApi__Scopes__0)'
            AzureAdB2C__Instance: '$(AzureAdB2C__Instance)'
            AzureAdB2C__ClientId: '$(AzureAdB2C__ClientId)'
            AzureAdB2C__ClientCredentials__0__SourceType: '$(AzureAdB2C__ClientCredentials__0__SourceType)'
            AzureAdB2C__ClientCredentials__0__ClientSecret: '$(AzureAdB2C__ClientCredentials__0__ClientSecret)'
            AzureAdB2C__Domain: '$(AzureAdB2C__Domain)'
            AzureAdB2C__SignUpSignInPolicyId: '$(AzureAdB2C__SignUpSignInPolicyId)'
            AzureAdB2C__SignUpSignInPolicyForAutomationId: '$(AzureAdB2C__SignUpSignInPolicyForAutomationId)'
            AzureAdB2C__RedirectUri: '$(AzureAdB2C__RedirectUri)'
            AzureAdB2C__UseAutomationPolicies: '$(AzureAdB2C__UseAutomationPolicies)'
            AzureAdB2C__CallBackPath: '$(AzureAdB2C__CallBackPath)'
            AzureAdB2C__SignedOutCallbackPath: '$(AzureAdB2C__SignedOutCallbackPath)' 
        # Step 6: Run Playwright E2E tests
        - task: DotNetCoreCLI@2
          displayName: 'Run Playwright End-to-End Tests'
          inputs:
            command: 'test'
            projects: 'Ofqual.Recognition.Frontend.Playwright/Ofqual.Recognition.Frontend.Playwright.csproj'
            arguments: '--no-build --no-restore'
          env:
            TestSettings__BaseUrl: '$(TestSettings__BaseUrl)'
            TestSettings__B2CUser__Username: '$(TestSettings__B2CUser__Username)'
            TestSettings__B2CUser__Password: '$(TestSettings__B2CUser__Password)'
            
# Build and Push Stage: This stage builds and pushes Docker images for Development/Preproduction and Production environments.
- stage: Build
  displayName: Build and Push Stage
  dependsOn: Test
  condition: succeeded()
  jobs:
  # Build and push to Dev/Preprod ACR
  - job: BuildDev
    displayName: Build and Push for Development/Preproduction
    condition: and(succeeded(), not(startsWith(variables['build.sourceBranch'], 'refs/pull')))
    steps:
    # Step 1: Build and push the Docker image to the Development/Preproduction container registry
    - task: Docker@2
      displayName: Build and Push Docker Image to Dev/Preprod Container Registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnectionDev)
        dockerfile: $(dockerfilePath)
        tags: |
          latest
          $(tag)
  # Build and push to Production ACR
  - job: BuildProd
    displayName: Build and Push for Production
    condition: and(succeeded(), startsWith(variables['build.sourceBranch'], 'refs/heads/releases'))
    steps:
    # Step 1: Build and push the Docker image to the Production container registry
    - task: Docker@2
      displayName: Build and Push Docker Image to Production Container Registry
      inputs:
        command: buildAndPush
        repository: $(imageRepository)
        containerRegistry: $(dockerRegistryServiceConnectionProd)
        dockerfile: $(dockerfilePath)
        tags: |
          latest
          $(tag)
